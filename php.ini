[PHP]
memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 300
max_input_time = 300
date.timezone = Africa/Nairobi
expose_php = Off

; Errors: never render to the client, always log to the container's stderr
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; disable_functions is set in the php-fpm pool (php-fpm.conf), not here, so
; that CLI tools (composer, yii queue workers) can still use proc_open/exec.

[Session]
session.cookie_httponly = 1

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.save_comments = 1
