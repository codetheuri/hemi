# Internal endpoints for the container HEALTHCHECK and FPM monitoring.
# Loopback only, and kept out of default.conf so apps that replace
# default.conf with their own vhost still have them.
server {
    listen 127.0.0.1:8099;
    access_log off;

    location ~ ^/fpm-(ping|status)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }

    location / {
        return 404;
    }
}
