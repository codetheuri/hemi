; Hemi overrides for the default [www] pool. Loaded after the upstream
; www.conf, docker.conf and zz-docker.conf, so values here win.
[www]
; Process manager, tunable per deployment via environment variables
; (defaults are set in the Dockerfile).
pm = ${PHP_FPM_PM}
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}
pm.max_requests = ${PHP_FPM_MAX_REQUESTS}

; Served on the loopback-only health vhost (health.conf), not to the public.
ping.path = /fpm-ping
pm.status_path = /fpm-status
access.suppress_path[] = /fpm-ping

; Web requests only: CLI (composer, queue workers) is not affected.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source,phpinfo
