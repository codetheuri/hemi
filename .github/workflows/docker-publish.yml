name: Build and Push Hemi Docker Image

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Optional: Automatically rebuild every Sunday at midnight to pick up OS/PHP CVE patches
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build amd64 once into the local daemon so it can be tested before
      # anything is pushed. The multi-arch push below reuses this cache.
      - name: Build image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: hemi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: sh ./smoke-test.sh hemi:ci

      # Pinned by commit SHA: trivy-action tags were hijacked in March 2026
      # (CVE-2026-33634), so never reference this action by a movable tag.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hemi:ci
          version: v0.76.1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: codetheuri/hemi
          tags: |
            type=raw,value=latest
            type=raw,value=8.4
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
